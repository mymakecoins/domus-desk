services:
  app:
    build: .
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_SERVER=db
      - DB_NAME=domus_desk
      - DB_USERNAME=domus_desk
      - DB_PASSWORD=domus_desk
      - ENCRYPTION_KEY_PATH=/var/www/encryption_keys/domus_desk.key
    volumes:
      - .:/var/www/html
      - ./docker/config.php:/var/www/html/config.php
      - ./docker/db_config.php:/var/www/html/db_config.php
      - attachments:/var/www/html/tickets/attachments
      - cm-attachments:/var/www/html/change-management/attachments
      - encryption-keys:/var/www/encryption_keys

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: domus_desk
      MYSQL_USER: domus_desk
      MYSQL_PASSWORD: domus_desk
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./database/domus-desk.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  attachments:
  cm-attachments:
  encryption-keys:
